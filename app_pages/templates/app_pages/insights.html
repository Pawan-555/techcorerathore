<div class="insights-container">
    <span class="badge">Insights & News</span>
    <h2>Our Latest Tech Articles</h2>

    <div class="blog-grid">
        {% for post in blog_posts %}
        <div class="blog-card">
            <div class="card-meta">
                <span>📁 {{ post.category }}</span>
                <span>💬 {{ post.comments.count }} Comments</span>
            </div>
            <h3>{{ post.title }}</h3>
            {% if post.image %}
                <img src="{{ post.image.url }}" alt="{{ post.title }}" class="blog-img">
            {% endif %}
            <div class="card-footer">
                <a href="{{ post.get_absolute_url }}" class="read-more">READ MORE</a>
                <span class="date">📅 {{ post.published_date|date:"F d, Y" }}</span>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
